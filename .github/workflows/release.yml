name: Release

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: pont-macos-arm64
          - os: macos-15-intel
            artifact: pont-macos-x64
          - os: ubuntu-latest
            artifact: pont-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract version from changelog
        id: version
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # No actions/setup-go: codeload stopped serving its tarballs
      # (404 by SHA for both v6 and v7 pins, Oct 15 2026; runners with a
      # warm cache still work, macOS runners did not). The runner images
      # ship Go and GOTOOLCHAIN=auto bootstraps whatever go.mod pins.
      - name: Go toolchain sanity
        run: |
          if ! command -v go >/dev/null; then
            GO_BIN="$(ls -d "$AGENT_TOOLSDIRECTORY"/go/*/arm64/bin "$AGENT_TOOLSDIRECTORY"/go/*/x64/bin 2>/dev/null | sort -V | tail -1)"
            echo "Activated toolcache Go: $GO_BIN"
            echo "$GO_BIN" >> "$GITHUB_PATH"
            export PATH="$GO_BIN:$PATH"
          fi
          go version
          go env GOTOOLCHAIN

      - name: Set version
        run: make set-version VERSION=${{ steps.version.outputs.version }}

      - name: Build binary
        run: make build

      - name: Rename binary
        run: mv dist/pont dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract changelog
        id: changelog
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          CONTENT=$(awk '
            /^## \[/ {
              if (found) exit
              found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            cp "$dir$name" "release/$name"
            chmod +x "release/$name"
          done
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.changelog.outputs.version }}
          name: pont v${{ steps.changelog.outputs.version }}
          body: ${{ steps.changelog.outputs.content }}
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
