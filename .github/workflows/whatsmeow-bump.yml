name: whatsmeow-bump

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Try latest whatsmeow
        id: bump
        run: |
          OLD=$(go list -m -f '{{.Version}}' go.mau.fi/whatsmeow)
          go get go.mau.fi/whatsmeow@latest
          go mod tidy
          NEW=$(go list -m -f '{{.Version}}' go.mau.fi/whatsmeow)
          echo "old=$OLD new=$NEW"
          if [ "$OLD" = "$NEW" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.bump.outputs.updated == 'true'
        run: make deps

      - name: Test
        if: steps.bump.outputs.updated == 'true'
        run: make test

      - name: Create pull request
        if: steps.bump.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW=$(go list -m -f '{{.Version}}' go.mau.fi/whatsmeow)
          git config user.name "sinjab-bump-bot"
          git config user.email "actions@users.noreply.github.com"
          BR="deps/whatsmeow-$(date +%Y%m%d)"
          git checkout -b "$BR"
          git add go.mod go.sum
          git commit -m "deps: bump whatsmeow to ${NEW}

          Auto-generated by the weekly whatsmeow-bump workflow."
          git push origin "$BR"
          gh pr create \
            --title "deps: bump whatsmeow to ${NEW}" \
            --body "Weekly whatsmeow bump (auto-generated).

          ## Merge gate — read before merging

          Green CI is **necessary but not sufficient**: it cannot see the live
          WhatsApp network. WhatsApp servers have broken stale protocol
          versions without warning (2026-09-29 405 wave; media-conn 403s).

          **Merge only after the live smoke test passes on the Mac:**

          \`\`\`
          scripts/smoke-test.sh   # against the dedicated smoke companion device
          \`\`\`

          Before installing the built binary: back up the session + message
          DBs (whatsmeow store migrations are forward-only — rollback can mean
          re-linking the device) and keep the previous binary for rollback."
